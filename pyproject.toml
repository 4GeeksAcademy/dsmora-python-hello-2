[project]
name = "dsmora-python-hello-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dsmora-4geeks", email = "dsmora4geeks@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "ddgs>=9.16.0",
    "fastapi>=0.115",
    "fastmcp>=4.1.0",
    "grandalf>=0.8",
    "httpx>=0.28",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "mcpauth==0.1.1",
    "pyjwt[crypto]>=2.10",
    "redis>=8.1.0",
    "tinydb>=4.8",
    "uvicorn>=0.34",
    "websockets>=15.0",
]

[project.scripts]
dsmora-python-hello-2 = "dsmora_python_hello_2:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
